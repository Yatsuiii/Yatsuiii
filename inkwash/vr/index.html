<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkwash: step into a world</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+Sans:wght@500;600&display=swap">
<style>
  :root { --paper: #f5efdf; --ink: #1f232b; --soft: #4b5465; --accent: #a8572e; --night: #1b1e25; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--paper); font-family: Alegreya, Georgia, serif; }
  #stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #intro { position: fixed; left: 16px; bottom: 16px; max-width: min(420px, calc(100% - 32px)); padding: 18px 20px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 14px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35); }
  #intro .eyebrow { margin: 0; font: 600 13px "Alegreya Sans", Arial, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
  #intro h1 { margin: 2px 0 6px; font-weight: 600; font-size: 30px; }
  #intro p { margin: 6px 0; line-height: 1.4; font-size: 16px; }
  #intro .faint { color: var(--soft); font-size: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  button { font: 600 15px "Alegreya Sans", Arial, sans-serif; padding: 10px 16px; border-radius: 999px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); cursor: pointer; }
  button.secondary { background: transparent; color: var(--ink); }
  button[hidden] { display: none; }
  #status:empty { display: none; }
  body.in-xr #intro { display: none; }
</style>
<!-- Inkwash's own core and atlas, the same files the studio runs: they set window.InkCore and window.InkAtlas -->
<script src="./lib/core.js"></script>
<script src="./lib/atlas.js"></script>
</head>
<body>
<div id="stage"></div>
<section id="intro" aria-live="polite">
  <p class="eyebrow">Inkwash</p>
  <h1 id="title">A world</h1>
  <p>Its map rises from your table. Reach out and touch a place to open its page; pinch above the map and turn your hand to turn it.</p>
  <div class="row">
    <button id="enter-ar" type="button" hidden>Enter with passthrough</button>
    <button id="enter-vr" class="secondary" type="button" hidden>Enter VR</button>
  </div>
  <p id="status">Opening the world…</p>
  <p id="note" class="faint"></p>
</section>
<script type="module" src="./src/main.js"></script>
</body>
</html>
