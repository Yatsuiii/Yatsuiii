[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stalefence"
version = "0.1.0"
description = "Guards for repos where several AI agents work at once: block work whose premises changed underneath it, reserve shared numbers atomically, lease tasks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []
keywords = ["ai-agents", "git", "claude-code", "multi-agent", "concurrency", "hooks"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
stalefence = "stalefence.cli:main"

[tool.setuptools.packages.find]
include = ["stalefence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
