[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpdrift"
version = "0.1.0"
description = "Measure post-publication drift in MCP server tool declarations"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcpdrift = "mcpdrift.cli:main"

[tool.setuptools.packages.find]
include = ["mcpdrift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
