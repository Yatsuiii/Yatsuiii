[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pagedrift"
version = "0.1.0"
description = "Flag Confluence pages whose code-level claims the current code contradicts"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pagedrift = "pagedrift.cli:main"

[tool.setuptools.packages.find]
include = ["pagedrift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
