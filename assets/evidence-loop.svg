<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title description">
  <title id="title">Raghav Sharma, AI systems engineer</title>
  <desc id="description">An animated trace moves from failure through evidence and a fix to a regression test.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#10172a"/>
      <stop offset="1" stop-color="#071b1c"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5f57"/>
      <stop offset="0.34" stop-color="#f7c948"/>
      <stop offset="0.67" stop-color="#55d6be"/>
      <stop offset="1" stop-color="#73a7ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .eyebrow { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 4px; fill: #8aa0b8; }
    .name { font: 700 42px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1px; fill: #f3f7fb; }
    .role { font: 500 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #a8b6c7; }
    .label { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; fill: #d8e1eb; }
    .trace-line { stroke-dasharray: 10 14; animation: flow 2.8s linear infinite; }
    .node { animation: pulse 5.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .node-2 { animation-delay: 1.4s; }
    .node-3 { animation-delay: 2.8s; }
    .node-4 { animation-delay: 4.2s; }
    .scan { animation: scan 7s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -48; } }
    @keyframes pulse {
      0%, 18%, 100% { opacity: .55; transform: scale(.88); }
      7% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes scan {
      0%, 12% { transform: translateX(-260px); opacity: 0; }
      18% { opacity: .22; }
      72% { opacity: .12; }
      82%, 100% { transform: translateX(1460px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .trace-line, .node, .scan { animation: none; }
      .node { opacity: 1; transform: none; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="278" rx="22" fill="url(#background)" stroke="#33465d" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="278" rx="22" fill="url(#grid)"/>
  <rect class="scan" x="0" y="1" width="220" height="278" fill="#7dd3fc" opacity="0"/>

  <text class="eyebrow" x="54" y="54">TRACE / RAGHAV.SHARMA</text>
  <text class="name" x="54" y="108">AI SYSTEMS ENGINEER</text>
  <text class="role" x="56" y="140">agent reliability · evals · protocol correctness</text>

  <path d="M 104 213 H 1096" fill="none" stroke="#314157" stroke-width="5" stroke-linecap="round"/>
  <path class="trace-line" d="M 104 213 H 1096" fill="none" stroke="url(#trace)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <g class="node node-1">
    <circle cx="104" cy="213" r="10" fill="#ff5f57" filter="url(#glow)"/>
    <text class="label" x="104" y="252" text-anchor="middle">FAILURE</text>
  </g>
  <g class="node node-2">
    <circle cx="435" cy="213" r="10" fill="#f7c948" filter="url(#glow)"/>
    <text class="label" x="435" y="252" text-anchor="middle">EVIDENCE</text>
  </g>
  <g class="node node-3">
    <circle cx="766" cy="213" r="10" fill="#55d6be" filter="url(#glow)"/>
    <text class="label" x="766" y="252" text-anchor="middle">FIX</text>
  </g>
  <g class="node node-4">
    <circle cx="1096" cy="213" r="10" fill="#73a7ff" filter="url(#glow)"/>
    <text class="label" x="1096" y="252" text-anchor="middle">REGRESSION</text>
  </g>

  <circle r="6" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="5.6s" repeatCount="indefinite" path="M 104 213 H 1096"/>
  </circle>
</svg>
