<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">Raghav Sharma — research notebook</title>
  <desc id="desc">Schematic studies of graph representations, controlled comparisons and spatial worlds. Connections change, control tiles rearrange and two viewpoints alternate around one shared object. These are conceptual illustrations, not measured results.</desc>
  <defs>
    <pattern id="paper" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".55" fill="#2f3d54" opacity=".07"/>
    </pattern>
    <clipPath id="page">
      <rect x="1" y="1" width="1198" height="448" rx="6"/>
    </clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .meta { font: 500 13px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 2px; fill: #637064; }
    .name { font: 76px Georgia, "Times New Roman", serif; letter-spacing: -2px; fill: #243349; }
    .subtitle { font-size: 23px; fill: #53615d; }
    .panel-label { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.7px; fill: #334a52; }
    .row-label { font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #6b746a; }
    .tile-label { font: 500 15px Georgia, "Times New Roman", serif; fill: #26384b; text-anchor: middle; }
    .graph-alt { animation: connection 12s ease-in-out infinite; }
    .graph-core { animation: core 12s ease-in-out infinite; }
    .control-a, .control-b { animation: rearrange-right 12s ease-in-out infinite; }
    .control-c, .control-d { animation: rearrange-left 12s ease-in-out infinite; }
    .view-left { animation: left-view 12s ease-in-out infinite; }
    .view-right { animation: right-view 12s ease-in-out infinite; }
    .face-left { animation: left-face 12s ease-in-out infinite; }
    .face-right { animation: right-face 12s ease-in-out infinite; }
    @keyframes connection { 0%, 10%, 90%, 100% { opacity: .12; } 35%, 65% { opacity: .9; } }
    @keyframes core { 0%, 10%, 90%, 100% { opacity: .85; } 35%, 65% { opacity: .24; } }
    @keyframes rearrange-right { 0%, 12%, 90%, 100% { transform: translateX(0); } 35%, 65% { transform: translateX(88px); } }
    @keyframes rearrange-left { 0%, 12%, 90%, 100% { transform: translateX(0); } 35%, 65% { transform: translateX(-88px); } }
    @keyframes left-view { 0%, 12%, 90%, 100% { opacity: .9; } 35%, 65% { opacity: .18; } }
    @keyframes right-view { 0%, 12%, 90%, 100% { opacity: .18; } 35%, 65% { opacity: .9; } }
    @keyframes left-face { 0%, 12%, 90%, 100% { fill-opacity: .19; } 35%, 65% { fill-opacity: .04; } }
    @keyframes right-face { 0%, 12%, 90%, 100% { fill-opacity: .04; } 35%, 65% { fill-opacity: .19; } }
    @media (prefers-reduced-motion: reduce) {
      .graph-alt, .graph-core, .control-a, .control-b, .control-c, .control-d, .view-left, .view-right, .face-left, .face-right { animation: none; }
      .graph-alt { opacity: .45; } .graph-core { opacity: .85; }
      .view-left, .view-right { opacity: .65; }
    }
  </style>

  <g clip-path="url(#page)">
    <rect width="1200" height="450" fill="#f3f0e7"/>
    <rect width="1200" height="450" fill="url(#paper)"/>
    <rect width="9" height="450" fill="#3a6c68"/>
    <text class="meta" x="47" y="39">YATSUIII / WORKING NOTES</text>
    <path d="M47 55H1153" stroke="#b5baad" stroke-width="1"/>
    <text class="name" x="45" y="138">Raghav Sharma</text>
    <text class="subtitle" x="49" y="178">Models, experiments, and interactive worlds.</text>

    <path d="M417 218V389M809 218V389" stroke="#b6bcae" stroke-dasharray="2 5"/>

    <text class="panel-label" x="49" y="235">REPRESENTATIONS</text>
    <g fill="none" stroke="#71827f" stroke-width="1.5">
      <path d="M77 294L138 269L193 307L252 278L326 307M77 294L98 355L161 357L229 351L303 353M138 269L161 357M193 307L229 351M252 278L303 353"/>
      <g class="graph-core" stroke="#2b6464" stroke-width="2.2">
        <path d="M98 355L193 307L326 307M138 269L252 278M161 357L229 351"/>
      </g>
      <g class="graph-alt" stroke="#b96145" stroke-width="2.2">
        <path d="M77 294L161 357L252 278M138 269L229 351L326 307M193 307L303 353"/>
      </g>
    </g>
    <g fill="#f3f0e7" stroke="#365d63" stroke-width="1.8">
      <circle cx="77" cy="294" r="5"/><circle cx="138" cy="269" r="5"/>
      <circle cx="193" cy="307" r="7" fill="#d8e4d9"/><circle cx="252" cy="278" r="5"/>
      <circle cx="326" cy="307" r="5"/><circle cx="98" cy="355" r="5"/>
      <circle cx="161" cy="357" r="5"/><circle cx="229" cy="351" r="5"/>
      <circle cx="303" cy="353" r="5"/>
    </g>

    <text class="panel-label" x="451" y="235">CONTROLLED COMPARISONS</text>
    <text class="row-label" x="452" y="277">reference</text>
    <text class="row-label" x="452" y="341">control</text>
    <g stroke="#73897d" stroke-width="1" fill="#dce5d8">
      <rect x="563" y="254" width="34" height="34" rx="3"/>
      <rect x="607" y="254" width="34" height="34" rx="3"/>
      <rect x="651" y="254" width="34" height="34" rx="3"/>
      <rect x="695" y="254" width="34" height="34" rx="3"/>
    </g>
    <g class="tile-label">
      <text x="580" y="277">A</text><text x="624" y="277">B</text>
      <text x="668" y="277">C</text><text x="712" y="277">D</text>
    </g>
    <g class="control-a"><rect x="563" y="318" width="34" height="34" rx="3" fill="#e7d7bf" stroke="#b49c7e"/><text class="tile-label" x="580" y="341">A</text></g>
    <g class="control-b"><rect x="607" y="318" width="34" height="34" rx="3" fill="#eadbd0" stroke="#b49c8d"/><text class="tile-label" x="624" y="341">B</text></g>
    <g class="control-c"><rect x="651" y="318" width="34" height="34" rx="3" fill="#d5e2dc" stroke="#90a79c"/><text class="tile-label" x="668" y="341">C</text></g>
    <g class="control-d"><rect x="695" y="318" width="34" height="34" rx="3" fill="#d8e0e9" stroke="#9ba9bb"/><text class="tile-label" x="712" y="341">D</text></g>

    <text class="panel-label" x="847" y="235">INTERACTIVE WORLDS</text>
    <g fill="none" stroke-width="1.4">
      <g class="view-left" stroke="#3d7a72">
        <path d="M863 349L942 297M863 349L996 375" stroke-dasharray="3 5"/>
        <path d="M846 342L863 332L880 342V361L863 371L846 361Z" fill="#dce7dd"/>
        <path d="M846 342L863 352L880 342M863 352V371"/>
      </g>
      <g class="view-right" stroke="#b66b4c">
        <path d="M1127 349L1051 297M1127 349L996 375" stroke-dasharray="3 5"/>
        <path d="M1110 342L1127 332L1144 342V361L1127 371L1110 361Z" fill="#ecddd0"/>
        <path d="M1110 342L1127 352L1144 342M1127 352V371"/>
      </g>
    </g>
    <g stroke="#3d5862" stroke-width="1.6" stroke-linejoin="round">
      <path d="M942 297L996 266L1051 297L996 329Z" fill="#dce4df"/>
      <path class="face-left" d="M942 297L996 329V375L942 343Z" fill="#39756a" fill-opacity=".19"/>
      <path class="face-right" d="M996 329L1051 297V343L996 375Z" fill="#a85c43" fill-opacity=".04"/>
      <path d="M969 313L1023 282M969 282L1023 313" fill="none" stroke="#3d5862" stroke-opacity=".25"/>
    </g>
    <path d="M47 410H1153" stroke="#b5baad"/>
    <text class="meta" x="49" y="435">NEUROSCIENCE / AGENT SYSTEMS / COMPUTATIONAL RESEARCH</text>
  </g>
  <rect x="1" y="1" width="1198" height="448" rx="6" fill="none" stroke="#c7cbbd"/>
</svg>
