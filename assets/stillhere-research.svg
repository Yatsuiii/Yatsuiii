<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">StillHere — Raghav Sharma</title>
  <desc id="desc">Listening studies before the scan. An animated trace connects plan, build, check and forecast beside a schematic cortical outline. This is a workflow illustration, not empirical brain data.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1725"/>
      <stop offset=".6" stop-color="#102536"/>
      <stop offset="1" stop-color="#12352f"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8c8e6"/>
      <stop offset=".5" stop-color="#c4ded8"/>
      <stop offset="1" stop-color="#92e1bd"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e6f2ef" stroke-opacity=".035"/>
    </pattern>
    <radialGradient id="wash">
      <stop stop-color="#86d9bc" stop-opacity=".13"/>
      <stop offset="1" stop-color="#86d9bc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .eyebrow { font: 500 14px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 2.7px; fill: #b0c2cc; }
    .name { font-weight: 650; font-size: 92px; letter-spacing: -4px; fill: #f3f4ed; }
    .subtitle { font-size: 27px; font-weight: 400; fill: #b8d0d7; }
    .label { font: 500 13px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 2px; fill: #b8cdd1; }
    .trace { stroke-dasharray: 4 11; animation: flow 5s linear infinite; }
    .traveller { animation: travel 9s ease-in-out infinite; }
    .cortex { animation: breathe 9s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -60; } }
    @keyframes travel { 0%, 8% { transform: translateX(0); opacity: 0; } 16% { opacity: 1; } 82% { opacity: 1; } 92%, 100% { transform: translateX(612px); opacity: 0; } }
    @keyframes breathe { 0%, 100% { opacity: .64; } 50% { opacity: .95; } }
    @media (prefers-reduced-motion: reduce) { .trace, .traveller, .cortex { animation: none; } .traveller { display: none; } .cortex { opacity: .9; } }
  </style>
  <rect x="1" y="1" width="1198" height="338" rx="16" fill="url(#paper)" stroke="#34505d"/>
  <rect x="1" y="1" width="1198" height="338" rx="16" fill="url(#grid)"/>
  <ellipse cx="979" cy="160" rx="227" ry="186" fill="url(#wash)"/>
  <text class="eyebrow" x="51" y="47">RAGHAV SHARMA / YATSUIII</text>
  <text class="name" x="47" y="151">StillHere</text>
  <text class="subtitle" x="52" y="198">Listening studies, before the scan.</text>

  <path d="M64 266H676" fill="none" stroke="#3b5563" stroke-width="1.5"/>
  <path class="trace" d="M64 266H676" fill="none" stroke="url(#signal)" stroke-width="2"/>
  <g fill="#0c1e2b" stroke="#a8c8d5" stroke-width="1.5">
    <circle cx="64" cy="266" r="6"/>
    <circle cx="268" cy="266" r="6"/>
    <circle cx="472" cy="266" r="6"/>
    <circle cx="676" cy="266" r="6" stroke="#92e1bd"/>
  </g>
  <circle class="traveller" cx="64" cy="266" r="3" fill="#effff5"/>
  <text class="label" x="52" y="304">PLAN</text>
  <text class="label" x="247" y="304">BUILD</text>
  <text class="label" x="449" y="304">CHECK</text>
  <text class="label" x="640" y="304" fill="#b2edd4">FORECAST</text>

  <g class="cortex" transform="translate(797 56)" fill="none" stroke="#99d6c6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M53 161C25 163 7 149 10 130C-2 114 7 94 24 88C15 65 29 43 53 43C56 22 78 11 99 20C116 3 145 7 157 25C179 13 204 24 209 44C232 38 253 55 252 76C280 80 294 102 282 124C293 145 277 164 255 167C242 190 213 195 193 179C170 192 146 188 133 176C109 190 78 181 69 164C63 165 57 164 53 161Z" fill="#9edbc4" fill-opacity=".035" stroke-width="2.1"/>
    <path d="M53 43C44 65 55 77 73 77C89 77 96 64 91 53C89 43 99 35 110 39C124 42 131 57 124 71"/>
    <path d="M99 20C113 26 117 39 110 49M157 25C144 38 148 56 164 61C178 66 190 57 188 44M209 44C202 59 210 72 226 75C240 78 245 90 237 102"/>
    <path d="M24 88C41 84 49 95 45 106C41 119 49 129 63 128C77 128 85 114 77 102C69 89 76 77 89 76"/>
    <path d="M10 130C24 124 34 133 35 145M69 164C66 148 79 141 91 146C105 151 112 143 110 132C107 118 119 109 132 114"/>
    <path d="M124 71C117 88 129 98 145 94C161 90 169 101 163 115C157 130 164 143 180 142C195 141 202 152 193 166L193 179"/>
    <path d="M133 176C124 164 132 151 143 150C154 148 159 137 151 128"/>
    <path d="M164 61C157 76 169 87 183 80C196 74 207 85 201 99C195 113 205 124 219 120C233 116 245 127 240 140"/>
    <path d="M255 167C241 163 230 171 219 165C205 158 209 144 218 138M252 76C242 82 249 94 262 96M282 124C269 118 256 130 263 143"/>
  </g>
  <path d="M764 37V305" stroke="#a8c8d5" stroke-opacity=".14"/>
</svg>
